name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Laufende Deployments nicht abbrechen, aber nur eines gleichzeitig zulassen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          # Schaltet Pages beim ersten Lauf selbst auf "GitHub Actions" um.
          enablement: true

      - name: dist hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Steht Pages noch auf "Deploy from branch", veroeffentlicht GitHub bei
      # jedem Push zusaetzlich den ungebauten Quellcode (-> Blackscreen). Wer
      # zuletzt fertig wird, gewinnt - also erst dieses Deployment abwarten.
      - name: Auf das Branch-Deployment warten
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")]')
            total=$(echo "$runs" | jq length)
            open=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            echo "Branch-Deployments: $total, davon offen: $open"
            if [ "$total" -gt 0 ] && [ "$open" -eq 0 ]; then exit 0; fi
            # Nach einer Minute ohne Branch-Deployment steht Pages bereits auf Actions.
            if [ "$total" -eq 0 ] && [ "$i" -ge 6 ]; then exit 0; fi
            sleep 10
          done
          echo "Branch-Deployment nicht abgeschlossen - deploye trotzdem."

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
