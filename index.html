<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Game</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #app canvas {
        display: block;
      }

      #debug-overlay {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        min-width: 230px;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: rgba(10, 14, 20, 0.72);
        backdrop-filter: blur(4px);
        color: #d6e1f0;
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }

      #debug-overlay .status-connected {
        color: #7ee787;
      }

      #debug-overlay .status-disconnected {
        color: #ff7b72;
      }

      #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0e14;
        color: #d6e1f0;
        font-size: 15px;
        letter-spacing: 0.04em;
        opacity: 1;
        transition: opacity 250ms ease;
      }

      #loading-overlay.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #loading-overlay .is-error {
        color: #ff7b72;
      }

      #fade-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 400ms ease;
      }

      #fade-overlay.is-opaque {
        opacity: 1;
      }

      #mission-hud {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        min-width: 170px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: rgba(10, 14, 20, 0.72);
        backdrop-filter: blur(4px);
        color: #d6e1f0;
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 12px;
        line-height: 1.6;
        letter-spacing: 0.06em;
        pointer-events: none;
        user-select: none;
      }

      #mission-hud .mission-title {
        margin-bottom: 4px;
        color: #ffd166;
        font-weight: 600;
      }

      #mission-hud .mission-time {
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffffff;
        font-size: 17px;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
      }

      #mission-hud .sensor-row {
        opacity: 0.45;
      }

      #mission-hud .sensor-row.is-found {
        color: #7ee787;
        opacity: 1;
      }

      #info-box {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        width: 300px;
        padding: 12px 16px 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-left: 3px solid #ffd166;
        border-radius: 8px;
        background: rgba(10, 14, 20, 0.86);
        backdrop-filter: blur(4px);
        color: #d6e1f0;
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
        user-select: none;
      }

      #info-box[hidden] {
        display: none;
      }

      #info-box .info-title {
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
      }

      #info-box .info-tag {
        margin-top: 2px;
        color: #8b98a9;
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      #info-box .info-section {
        margin: 10px 0 4px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffd166;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #info-box .info-product + .info-product {
        margin-top: 6px;
      }

      #info-box .info-name {
        font-weight: 600;
      }

      #info-box .info-product.is-used .info-name {
        color: #7ee787;
      }

      #info-box .info-type {
        color: #a9b6c7;
      }

      #info-box .info-product.is-soon {
        opacity: 0.6;
        font-style: italic;
      }
      #info-box .info-product.is-other {
        opacity: 0.55;
      }

      #info-box .info-product.is-current .info-name::after {
        content: "  \25c0 now";
        color: #7ee787;
        font-size: 0.75em;
        font-weight: 400;
        letter-spacing: 0.06em;
      }

      #info-box .info-text {
        margin-top: 6px;
        color: #c3cfdd;
      }

      #info-box.is-prominent {
        left: 24px;
        bottom: 24px;
        width: 440px;
        padding: 22px 26px 24px;
        border: 1px solid rgba(126, 231, 135, 0.35);
        border-left: 6px solid #7ee787;
        border-radius: 12px;
        background: rgba(8, 12, 18, 0.94);
        box-shadow:
          0 0 0 1px rgba(126, 231, 135, 0.08),
          0 12px 40px rgba(0, 0, 0, 0.55),
          0 0 32px rgba(126, 231, 135, 0.18);
        font-size: 16px;
        line-height: 1.45;
      }

      #info-box.is-prominent .info-title {
        font-size: 24px;
        letter-spacing: 0.01em;
      }

      #info-box.is-prominent .info-tag {
        margin-top: 4px;
        font-size: 13px;
      }

      #info-box.is-prominent .info-section {
        margin: 16px 0 8px;
        padding-top: 12px;
        color: #7ee787;
        font-size: 13px;
      }

      #info-box.is-prominent .info-product.is-used .info-name {
        font-size: 21px;
      }

      #info-box.is-prominent .info-product.is-used .info-type {
        font-size: 17px;
      }

      #info-box.is-prominent .info-product + .info-product {
        margin-top: 10px;
      }

      #prompt {
        position: fixed;
        left: 50%;
        bottom: 56px;
        z-index: 10;
        transform: translateX(-50%);
        padding: 9px 18px;
        border: 1px solid rgba(255, 209, 102, 0.35);
        border-radius: 999px;
        background: rgba(10, 14, 20, 0.8);
        color: #ffd166;
        font-size: 14px;
        letter-spacing: 0.03em;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
      }

      #message-overlay {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(6, 9, 14, 0.62);
        backdrop-filter: blur(2px);
        pointer-events: none;
        user-select: none;
      }

      #message-overlay[hidden] {
        display: none;
      }

      .message-card {
        max-width: 540px;
        padding: 28px 34px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-top: 3px solid #ffd166;
        border-radius: 10px;
        background: rgba(11, 14, 20, 0.94);
        color: #d6e1f0;
        line-height: 1.6;
      }

      .message-card.tone-win {
        border-top-color: #7ee787;
      }

      .message-card.tone-fail {
        border-top-color: #ff7b72;
      }

      .message-card h1 {
        margin: 0 0 14px;
        color: #ffd166;
        font-size: 20px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .message-card.tone-win h1 {
        color: #7ee787;
      }

      .message-card.tone-fail h1 {
        color: #ff7b72;
      }

      .message-card p {
        margin: 0 0 10px;
        font-size: 14px;
      }

      .message-card p strong {
        color: #ffd166;
        font-weight: 600;
      }

      .message-card .message-footer {
        margin-top: 18px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffd166;
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 13px;
      }

      .message-tab {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .message-tab-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 8px 0;
        color: #aebdd0;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .message-tab-label::before {
        content: "\25b8";
        display: inline-block;
        width: 1.2em;
      }

      .message-tab.is-open .message-tab-label {
        color: #ffd166;
      }

      .message-tab.is-open .message-tab-label::before {
        content: "\25be";
      }

      .message-tab-key {
        margin-left: auto;
        font-family: "Cascadia Mono", "Consolas", monospace;
        letter-spacing: 0;
        text-transform: none;
        opacity: 0.7;
      }

      .message-tab.is-open .message-tab-key {
        visibility: hidden;
      }

      .message-tab-body {
        padding-bottom: 6px;
      }

      .message-tab:not(.is-open) .message-tab-body {
        display: none;
      }

      .message-tab-body > .control-table:first-child {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }

      .control-table {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 18px;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 13px;
      }

      .control-key {
        color: #ffd166;
        font-family: "Cascadia Mono", "Consolas", monospace;
        white-space: nowrap;
      }

      .control-table.has-gamepad {
        grid-template-columns: max-content max-content 1fr;
      }

      .control-head {
        margin-bottom: 2px;
        color: #8b98a9;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .control-key.is-gamepad {
        color: #9fd3ff;
      }

      #gamepad-hint {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        max-width: 420px;
        padding: 8px 12px;
        border: 1px solid rgba(159, 211, 255, 0.3);
        border-radius: 8px;
        background: rgba(10, 14, 20, 0.8);
        color: #d6e1f0;
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 11px;
        line-height: 1.5;
        pointer-events: none;
        user-select: none;
      }

      #gamepad-hint[hidden] {
        display: none;
      }

      #gamepad-hint .gamepad-hint-title {
        color: #9fd3ff;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .control-action {
        color: #aebdd0;
      }

      .score-table {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 13px;
      }

      .score-head {
        margin-bottom: 6px;
        color: #ffd166;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .score-row {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 10px;
        padding: 2px 0;
        color: #aebdd0;
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-variant-numeric: tabular-nums;
      }

      .score-row.is-new {
        color: #7ee787;
        font-weight: 600;
      }

      .score-time {
        color: inherit;
      }

      .score-date {
        opacity: 0.55;
      }

      #title-screen {
        position: fixed;
        inset: 0;
        z-index: 22;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: radial-gradient(
          ellipse at center,
          rgba(6, 9, 14, 0.55) 0%,
          rgba(6, 9, 14, 0.85) 75%
        );
        opacity: 1;
        transition: opacity 700ms ease;
        pointer-events: none;
        user-select: none;
      }

      #title-screen.is-hidden {
        opacity: 0;
      }

      #title-screen .title-logo {
        width: 230px;
        margin-bottom: 26px;
        padding: 12px 18px;
        border-radius: 6px;
        /* Das Logo-PNG ist fuer hellen Untergrund gedacht. */
        background: #fff;
        animation: title-rise 1100ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      #title-screen .title-name {
        margin: 0;
        background: linear-gradient(180deg, #ffffff 30%, #ff9aa2 70%, #e2001a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-size: clamp(42px, 8vw, 104px);
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        filter: drop-shadow(0 0 28px rgba(226, 0, 26, 0.45));
        animation: title-rise 1100ms 150ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      #title-screen .title-subtitle {
        color: #9fb3c8;
        font-size: clamp(12px, 1.6vw, 18px);
        letter-spacing: 0.42em;
        text-transform: uppercase;
        animation: title-rise 1100ms 320ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes title-rise {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
